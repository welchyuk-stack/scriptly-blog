# Site settings
title: MacBound
email: welchyuk@gmail.com
description: >-
  A Mac content hub: AppleScript automation with Scriptly, a full Windows-to-Mac
  switching guide, and screenshot & markup tips with SnipClip.

# URLs
url: "https://macbound.com"
baseurl: ""
repository: welchyuk-stack/scriptly-blog

# Build settings
markdown: kramdown
theme: minima
permalink: /scriptly/:title/

# Jekyll ignores underscore-prefixed files and dotfiles/dot-directories by
# default — these are control files (Cloudflare headers, IndexNow key,
# RFC 9116 security contact) that must ship as-is.
include:
  - _headers
  - .well-known
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-redirect-from

# Collections
collections:
  windows_to_mac:
    output: true
    permalink: /windows-to-mac/:path/
  snipclip:
    output: true
    permalink: /snipclip/:path/

# jekyll-feed: include the two new collections alongside _posts so RSS
# covers all three sections, not just Scriptly. Default posts_limit is 10,
# which silently truncated the 14-post Windows→Mac feed — raised well above
# any section's current post count.
feed:
  collections:
    - windows_to_mac
    - snipclip
  posts_limit: 100

# SEO
lang: en
locale: en_US
author: "Luke Welch"
twitter:
  username: scriptlyapp
  card: summary_large_image

# Link-preview (Open Graph/Twitter Card) images. jekyll-seo-tag reads
# `page.image`, which Jekyll's front-matter `defaults` can set per-path
# without touching the plugin's (buggy) `logo:`/publisher code path.
defaults:
  - scope:
      path: ""
    values:
      image: /assets/images/social/default.jpg
  - scope:
      path: "scriptly"
    values:
      image: /assets/images/scriptly/social-preview.jpg
  - scope:
      path: ""
      type: posts
    values:
      image: /assets/images/scriptly/social-preview.jpg
  - scope:
      path: "snipclip"
    values:
      image: /assets/images/snipclip/social-preview.jpg
  - scope:
      path: ""
      type: snipclip
    values:
      image: /assets/images/snipclip/social-preview.jpg
  - scope:
      path: "porthole"
    values:
      image: /assets/images/porthole/social-preview.jpg
  - scope:
      path: "topbox"
    values:
      image: /assets/images/topbox/social-preview.jpg

# NOTE: intentionally no top-level `logo:` key (renamed to org_logo below).
# jekyll-seo-tag reads `logo:` only to emit its own "publisher" JSON-LD block,
# which hardcodes publisher.name to the resolved author's PERSONAL name (a
# plugin bug with no config override) — colliding with the correctly-typed
# Organization block we hand-author in _includes/head.html. Omitting `logo:`
# makes the plugin skip that block entirely (jekyll-seo-tag/drop.rb#logo:
# `return unless site["logo"]`), leaving only our correct schema. Our own
# Organization block uses `org_logo:` instead, which the plugin doesn't know
# about, so it can't trigger the same bug.
org_logo: /assets/images/scriptly-logo.png

# Note: jekyll-seo-tag only renders the top-level google_site_verification
# key when webmaster_verifications is unset; since webmaster_verifications
# is set below, only webmaster_verifications.google actually appears in the
# page. Kept both in sync anyway to avoid confusion. Replaced the old Google
# token (never actually completed — GSC showed "no access" under the site's
# own account) with a fresh one generated 2026-08-31.
google_site_verification: 6ZAjjvwt281kb3_P3hcuiQ2u3Vei7Y8ysF0IU9uk-M0
webmaster_verifications:
  google: 6ZAjjvwt281kb3_P3hcuiQ2u3Vei7Y8ysF0IU9uk-M0
  bing: 5F7C9B6BB8D05475018B67DC707860F4

social:
  name: MacBound
  links:
    - https://github.com/welchyuk-stack/scriptly-blog

# Section metadata — product/section-specific bits referenced from layouts,
# so nothing is hardcoded in templates.
sections:
  scriptly:
    name: Scriptly
    tagline: "AppleScript & Automation"
    accent: "#14275c"
    accent_dark: "#0a1024"
    url: /scriptly/
    app_url: "https://apps.apple.com/us/app/scriptly-script-automations/id6788839033?mt=12"
    twitter: scriptlyapp
    price: "4.99"
  windows_to_mac:
    name: "Windows → Mac"
    tagline: "Switching Guide"
    accent: "#14275c"
    url: /
  snipclip:
    name: SnipClip
    tagline: "Screenshots & Markup"
    accent: "#14275c"
    accent_dark: "#0a1024"
    url: /snipclip/
    app_url: "https://apps.apple.com/gb/app/snipclip/id6789209242"
    price: "1.99"
  porthole:
    name: PortHole
    tagline: "Menu-Bar Display Fixes"
    accent: "#14275c"
    accent_dark: "#0a1024"
    url: /porthole/
    # No app_url yet — not archived/uploaded to App Store Connect as of
    # 2026-08-31. Add once it's actually live; until then the landing page
    # shows "coming soon" instead of a download badge.
    price: "2.99"
  topbox:
    name: TopBox
    tagline: "Clipboard & File Shelf"
    accent: "#14275c"
    accent_dark: "#0a1024"
    url: /topbox/
    # No app_url yet — not submitted to App Store Connect as of 2026-08-31.
    # Add once it's live; until then the landing page shows "coming soon".
    price: "2.99"

# Exclude from processing
exclude:
  - .gitignore
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
  - README.md
  - macbound-build-plan.md
