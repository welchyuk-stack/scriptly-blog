# Site settings
title: Scriptly Blog
email: welchyuk@gmail.com
description: >-
  Mac automation guides, AppleScript tutorials, and copy-paste templates.
  Learn how to automate your Mac with zero coding required.

# URLs
url: "https://welchyuk-stack.github.io"
baseurl: "/scriptly-blog"
repository: welchyuk-stack/scriptly-blog

# Build settings
markdown: kramdown
theme: minima
permalink: /:title/
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-paginate

# Pagination
paginate: 10
paginate_path: "/blog/page:num/"

# SEO
lang: en
locale: en_US
author: "Luke Welch"
twitter:
  username: scriptlyapp
  card: summary

logo: /assets/images/scriptly-logo.png

google_site_verification: dtVfpsOb02W8ArqVl9I3m6sFd3x6S6ZQR5S6dyWw-WE
webmaster_verifications:
  google: dtVfpsOb02W8ArqVl9I3m6sFd3x6S6ZQR5S6dyWw-WE
  bing: 5F7C9B6BB8D05475018B67DC707860F4

social:
  name: Scriptly
  links:
    - https://github.com/welchyuk-stack/scriptly-blog

# Exclude from processing
exclude:
  - .gitignore
  - Gemfile
  - Gemfile.lock
  - node_modules
  - README.md
