---
layout: default
---
<div class="wrap wrap--wide">
  <div class="hero">
    <h1>{{ page.title | default: site.title }}</h1>
    <p>{{ page.description | default: site.description }}</p>
  </div>

  <div class="card-grid">
    {%- for entry in site.sections -%}
    {%- assign section = entry[1] -%}
    <a class="card" href="{{ section.url | relative_url }}">
      <div class="card__accent" style="background: {{ section.accent }};"></div>
      <h3>{{ section.name }}</h3>
      <p>{{ section.tagline }}</p>
    </a>
    {%- endfor -%}
  </div>

  {{ content }}
</div>
