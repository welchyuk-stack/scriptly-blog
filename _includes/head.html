<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {%- if page.noindex %}
  <meta name="robots" content="noindex, follow">
  {%- endif %}

  <!-- Favicon: navy "M" + signal-green dot, matching the site wordmark. -->
  <link rel="icon" href="{{ '/favicon.ico' | relative_url }}" sizes="any">
  <link rel="icon" type="image/svg+xml" href="{{ '/assets/icons/favicon.svg' | relative_url }}">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ '/assets/icons/favicon-32x32.png' | relative_url }}">
  <link rel="icon" type="image/png" sizes="16x16" href="{{ '/assets/icons/favicon-16x16.png' | relative_url }}">
  <link rel="apple-touch-icon" sizes="180x180" href="{{ '/assets/icons/apple-touch-icon.png' | relative_url }}">
  <link rel="manifest" href="{{ '/site.webmanifest' | relative_url }}">
  <meta name="theme-color" content="#14275c">

  {%- seo -%}

  <!-- Site Organization + author Person entities. jekyll-seo-tag's own
       "publisher" block above hardcodes the author's name as the org name
       (a plugin quirk, not configurable) — this supplements it with a
       correctly-typed Organization and a fuller Person record. -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "@id": "{{ site.url }}/#organization",
    "name": "{{ site.social.name }}",
    "url": "{{ site.url }}/",
    "description": {{ site.description | strip | jsonify }},
    "founder": { "@id": "{{ site.url }}/about/#person" },
    "logo": {
      "@type": "ImageObject",
      "url": "{{ site.org_logo | absolute_url }}"
    },
    "sameAs": [
      {%- for link in site.social.links -%}
        "{{ link }}"{% unless forloop.last %},{% endunless %}
      {%- endfor -%}
    ]
  }
  </script>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "@id": "{{ site.url }}/about/#person",
    "name": "{{ site.author }}",
    "url": "{{ site.url }}/about/",
    "jobTitle": "Independent Mac app developer",
    "knowsAbout": ["macOS", "Mac menu bar apps"],
    "worksFor": { "@id": "{{ site.url }}/#organization" },
    "sameAs": [
      {%- for link in site.social.links -%}
        "{{ link }}"{% unless forloop.last %},{% endunless %}
      {%- endfor -%}
    ]
  }
  </script>

  <link rel="stylesheet" href="{{ "/assets/css/main.css" | relative_url }}">
  {%- if jekyll.environment == 'production' and site.google_analytics -%}
    {%- include google-analytics.html -%}
  {%- endif -%}
  <!-- Cloudflare Web Analytics -->
  <script defer src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "b042b81716554e79a8f549da09188a1e"}'></script>
  <!-- End Cloudflare Web Analytics -->
</head>
