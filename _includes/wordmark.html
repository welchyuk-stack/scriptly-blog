{%- comment -%}

  rotated-square dot in the signal green. Inherits --accent for pages that
  set a per-section accent, but the dot is always signal green.
{%- endcomment -%}
<span class="logo-wordmark" aria-label="MacBound"><span aria-hidden="true"><span class="logo-wordmark__mac">Mac</span><span class="logo-wordmark__bound">Bound</span><span class="logo-wordmark__dot"></span></span></span>
