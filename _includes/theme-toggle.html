{%- comment -%}
  Light/dark toggle. Include inside .site-nav__links in _includes/nav.html:
  {% include theme-toggle.html %}
  Sets data-theme on <html>, persists to localStorage, defaults to the
  visitor's OS preference.
{%- endcomment -%}
<button class="theme-toggle" id="theme-toggle" type="button" aria-label="Toggle dark mode">◐ Theme</button>
<script>
(function () {
  var root = document.documentElement;
  var saved = localStorage.getItem('macbound-theme');
  var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  root.setAttribute('data-theme', saved || (prefersDark ? 'dark' : 'light'));
  document.getElementById('theme-toggle').addEventListener('click', function () {
    var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    localStorage.setItem('macbound-theme', next);
  });
})();
</script>
