{%- comment -%}
  Light/dark toggle. Include inside .site-nav__links in _includes/nav.html:
  {% include theme-toggle.html %}
  Sets data-theme on <html>, persists to localStorage, defaults to the
  visitor's OS preference.
{%- endcomment -%}
<button class="theme-toggle" id="theme-toggle" type="button" aria-label="Toggle dark mode">◐ Theme</button>
<!-- No `defer`/`async`: this must run synchronously at this point in the
     body, before any more content paints, or dark-mode visitors see a
     flash of the light theme first. -->
<script src="{{ '/assets/js/theme-toggle.js' | relative_url }}"></script>
